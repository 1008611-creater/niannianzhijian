    <!-- overlay 旗（?nomiOverlay=browserAsset）由 src/main.tsx 在 React 渲染前设置——
         别在这里加内联 <script>：打包态 CSP（script-src 'self'）会拦，dev 放行造成两态不一致。 -->
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f7f4ed;
      }

      html[data-nomi-overlay="browserAsset"],
      html[data-nomi-overlay="browserAsset"] body,
      html[data-nomi-overlay="browserAsset"] #root {
        background: transparent;
      }

      html[data-nomi-overlay="browserAsset"] #nomi-boot-shell {
        display: none;
        background: transparent;
      }

      html.nomi-project-route-pending .nomi-library-page {
        display: none !important;
      }

      #nomi-boot-shell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: #2a2118;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #nomi-boot-spinner {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        border: 1px solid rgba(42, 33, 24, 0.14);
        border-top-color: #9a6a3c;
        animation: nomi-boot-spin 680ms linear infinite;
      }

      @media (max-width: 640px) {
        .nomi-library-page__main {
          padding: 24px 16px 40px !important;
          gap: 16px !important;
        }

        .nomi-library-page__main > section[aria-label] {
          flex-wrap: wrap;
        }

        .nomi-library-page__main > section[aria-label] > .tc-action-card {
          width: 100%;
          min-width: 0;
        }
      }

      @keyframes nomi-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
