name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Local contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install production-compatible dependencies
        run: npm ci --ignore-scripts=false

      - name: Run NianNian quality gate
        run: npm run test:quality-gate

      - name: Run TypeScript gate
        run: npm run typecheck

      - name: Run ESLint gate
        run: npm run lint

      - name: Build exact candidate
        run: npm run build
